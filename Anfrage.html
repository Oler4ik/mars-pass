			<main class="hero flex justify-content-center flex-grow-1">
				<form class="flex" onsubmit="sent(event)">
					<h1>TICKET ANFRAGEN</h1>
					<p>UNVERBINDLICHE ANFRAGE</p><br>

						<div class="feld">
							<label for="vorname">VORNAME</label>
							<input type="text" id="vorname" required>
						</div>

						<div class="feld">
							<label for="nachname">NACHNAME</label>
							<input type="text" id="nachname" required>
						</div>
						
						<div class="feld">
							<label for="alt">ALTER</label>
							<input type="number" id="alt" required>
						</div>
					
					
					<div class="feld">
						<label for="email">E-MAIL</label>
						<input type="email" id="email" required>
					</div>
					
					<div class="feld">
						<label for="klasse">REISEKLASSE</label>
						<select id="klasse">
							<option>Orbital Class</option>
							<option>Explorer Class</option>
							<option>Premium Class</option>
						</select>
					</div>
					
					<div id="comment">
						<input type="button" onclick="addComment()" value="Kommentar hinzufuegen"><br>
					</div>
					<button class="button"  type="submit">ANFRAGE SENDEN -> </button>
